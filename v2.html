<script type="module">
const $=(s,r=document)=>r.querySelector(s);const money=(n)=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const icon=(id)=>`<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${id}"/></svg>`;
const state={tab:'home',expanded:false,slide:0,day:6,period:'Semana',category:'Todos',heatDay:5,card:0,reviewed:[],firstShow:true};
const labels=['S','T','Q','Q','S','S','D'];const data=[{name:'Mercado',kind:'Alimentação',amount:126.8,icon:'bag',color:'red'},{name:'Pix recebido',kind:'Transferência',amount:1950,icon:'trend',color:'green'},{name:'Estorno de compra',kind:'Reembolso',amount:349.9,icon:'refresh',color:'purple'}];
const stars=[{title:'Visão do dia',kicker:'Hoje',value:'R$ 270',headline:'Seu ritmo, seu controle.',hint:'Acompanhe as saídas da semana',theme:'sun',ruler:['Seg','Qua','Sex']},{title:'Meta semanal',kicker:'Planejamento',value:'78%',headline:'Ainda há espaço.',hint:'R$ 930 disponíveis no limite',theme:'moon',ruler:['Gasto','Meta','Livre']},{title:'Cartões',kicker:'Organização',value:'3 ativos',headline:'Tudo em um lugar.',hint:'Concilie os seus lançamentos',theme:'forest',ruler:['Nubank','Itaú','Inter']}];
let autoClose=null,autoAdvance=null,toastTimeout=null;
function jelly(cls='',contents=''){return `<span class="jelly ${cls}">${contents}</span>`}
function heroMarkup(){return `<div class="hero-region" id="heroRegion"><div class="compact-hero" id="compactHero"><button class="milestone" data-open="1" aria-label="Abrir resumo de receitas">${jelly('lime',`<span class="value">1,9k</span>`)}<span>Entradas</span></button><button class="milestone is-main" data-open="1" aria-label="Abrir carrossel financeiro">${jelly('orange',`<span class="value">3,4k</span>`)}<span>Saídas</span></button><button class="milestone" data-open="1" aria-label="Abrir resumo de estornos">${jelly('lilac',`<span class="value">350</span>`)}<span>Estornos</span></button></div><div class="expanded-hero" id="expandedHero"><div class="carousel-viewport" id="carouselViewport"><div class="carousel-track" id="carouselTrack">${stars.map((s,i)=>`<article class="carousel-slide ${s.theme}" data-slide="${i}" aria-label="${s.title}"><div class="slide-top"><span class="slide-chip">${icon(i===0?'trend':i===1?'sparkle':'card')} ${s.kicker}</span><button class="slide-play" aria-label="Ver ${s.title}" data-action="slideAction">${icon('play')}</button></div><div class="slide-timer">${s.value}</div><div class="slide-text"><h3>${s.headline}</h3><p>${s.hint}</p></div><div class="ruler" aria-hidden="true">${Array.from({length:47},()=>'<i></i>').join('')}</div><div class="ruler-labels">${s.ruler.map(k=>`<span>${k}</span>`).join('')}</div></article>`).join('')}</div><button class="carousel-prev" data-action="prev" aria-label="Card anterior">${icon('chevron-left')}</button><button class="carousel-next" data-action="next" aria-label="Próximo card">${icon('arrow')}</button></div><div class="carousel-dots" role="tablist" aria-label="Cards financeiros">${stars.map((s,i)=>`<button role="tab" aria-label="Ir para ${s.title}" data-index="${i}" aria-selected="${i===state.slide}"></button>`).join('')}</div></div><div class="greeting"><h1>bom dia, <span>seu dinheiro</span></h1><p>Um olhar mais leve para cada escolha.</p></div></div>`}
function weekMarkup(){return `<section class="surface week"><div class="week-head"><span>Esta semana</span><small>${icon('sparkle')} <b>4</b> de 7 dias</small></div><div class="days">${labels.map((d,i)=>`<button type="button" class="day-cell ${[2,4].includes(i)?'inactive':i>6?'future':''} ${state.day===i?'selected':''}" data-day="${i}" aria-label="${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'][i]}" aria-pressed="${state.day===i}">${jelly([0,3,6].includes(i)?'orange':[1,5].includes(i)?'lilac':'lime',`<span class="day-num">${[0,1,3,5,6].includes(i)?'✓':''}</span>`)}<span class="weekday">${d}</span></button>`).join('')}</div></section>`}
function winsMarkup(){return `<div class="section-title"><h2>Pequenas conquistas</h2><button data-action="wins">Ver tudo</button></div><div class="wins"><button type="button" class="win surface" data-action="goal"><span class="win-label">${icon('sparkle')} Meta</span>${jelly('lilac')}<small>Disponível na semana</small><strong>930 <span class="suffix">reais</span></strong></button><button type="button" class="win surface" data-action="refund"><span class="win-label">${icon('refresh')} Estornos</span>${jelly('lime')}<small>Valor recuperado</small><strong>349,90 <span class="suffix">R$</span></strong></button></div>`}
function transactionMarkup(t){return `<div class="transaction"><div class="transaction-symbol ${t.color}">${icon(t.icon)}</div><div class="transaction-name"><b>${t.name}</b><small>${t.kind}</small></div><strong class="transaction-amount ${t.color==='green'?'in':'out'}">${t.color==='green'?'+':t.color==='purple'?'+':'−'} ${money(t.amount)}</strong></div>`}
function home(){return `<div class="screen-page" id="homePage">${heroMarkup()}${weekMarkup()}${winsMarkup()}<section class="surface daily-note"><div class="note-label">${icon('sparkle')} Uma ideia para hoje</div><h3>Qual pequena escolha pode fazer diferença esta semana?</h3><div class="note-foot"><button class="tiny-dark" data-action="tip">Explorar</button><button class="tiny-icon" aria-label="Próxima ideia" data-action="tip">${icon('arrow')}</button></div></section><div class="section-title"><h2>Movimentações</h2><button data-tab-go="expenses">Ver todas</button></div><div class="surface transactions">${data.map(transactionMarkup).join('')}</div></div>`}
function heading(tag,title,desc){return `<header class="page-header"><small>${tag}</small><h1>${title}</h1><p>${desc}</p></header>`}
function expenses(){const categories=[{n:'Alimentação',v:1240,c:'orange',sub:'Mercados e restaurantes'},{n:'Compras',v:965,c:'lilac',sub:'Lojas e marketplace'},{n:'Transporte',v:714,c:'lime',sub:'Mobilidade'},{n:'Casa',v:549.2,c:'red',sub:'Despesas domésticas'}];return `<div class="screen-page">${heading('Seu panorama','Gastos','Acompanhe os números sem perder os detalhes.')}<section class="surface overview orange"><small>Saídas líquidas</small><strong>${money(state.period==='Semana'?270:3468.20)}</strong><span class="highlight">${state.period==='Semana'?'Semana atual · meta de R$ 1.200,00':'Período demonstrativo'}</span><svg class="mini-spark" viewBox="0 0 310 75" preserveAspectRatio="none"><defs><linearGradient id="warmFade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2b08c" stop-opacity=".45"/><stop offset="1" stop-color="#f2b08c" stop-opacity="0"/></linearGradient></defs><path class="area" d="M0 55C25 53 44 68 63 49S103 15 123 36S172 71 201 37S248 52 270 24S294 27 310 9V75H0Z"/><path class="line" d="M0 55C25 53 44 68 63 49S103 15 123 36S172 71 201 37S248 52 270 24S294 27 310 9"/></svg></section><div class="chips" aria-label="Selecionar período">${['Semana','Mês','Tudo'].map(p=>`<button class="chip ${p===state.period?'on':''}" data-period="${p}">${p}</button>`).join('')}</div><div class="section-title"><h2>Categorias</h2><button data-action="category">Detalhes</button></div>${categories.map(c=>`<div class="surface category">${jelly(c.c)}<div class="copy"><strong>${c.n}</strong><small>${c.sub}</small><div class="bar"><i style="width:${c.v/1240*100}%"></i></div></div><b class="amount">${money(c.v)}</b></div>`).join('')}<div class="section-title"><h2>Calendário</h2><button data-action="calendar">Novembro</button></div><div class="surface"><div class="heatmap">${Array.from({length:35},(_,i)=>{let d=i-5;return `<button ${d<1||d>30?'disabled':''} class="${d>0&&d<=5?'lv'+(d%4+1):''} ${state.heatDay===d?'sel':''}" data-heat="${d}" aria-label="Dia ${d}">${d>0&&d<=30?d:''}</button>`}).join('')}</div><div class="heatmap-detail">Dia ${state.heatDay} · ${state.heatDay<=5?'Há movimentações':'Sem dados de demonstração para este dia'}</div></div></div>`}
function ads(){return `<div class="screen-page">${heading('Benefícios','Anúncios','Encontre oportunidades sem comprometer o orçamento.')}<div class="surface overview"><small>Seu espaço de descobertas</small><strong>Escolhas mais leves.</strong><div class="highlight">Catálogos ainda não conectados · demonstração</div></div><div class="section-title"><h2>Explorar</h2><button data-action="adInfo">Como funciona?</button></div><div class="surface offer-card"><div class="offer-icon">${icon('bag')}</div><h3>Ofertas com propósito</h3><p>Conecte os programas de afiliados para exibir produtos reais e acompanhar descontos verificados.</p><button data-action="adDemo">Ver integrações</button></div><div class="surface offer-card green"><div class="offer-icon">${icon('sparkle')}</div><h3>Priorize a sua meta</h3><p>Compare qualquer compra planejada com o saldo disponível na semana antes de decidir.</p><button data-action="goal">Consultar meta</button></div></div>`}
function cards(){const banks=[{n:'Nubank Ultravioleta',last:'4821',s:'Compras e lançamentos',kind:'purple'},{n:'Itaú Personnalité',last:'7310',s:'Acompanhamento financeiro',kind:'gold'},{n:'Inter Black',last:'2044',s:'Cartão vinculado',kind:'coral'}];return `<div class="screen-page">${heading('Seus cartões','Cartões','Três cartões de demonstração organizados.')}<div class="card-stack">${banks.map((b,i)=>`<button class="bank-card ${b.kind} ${state.card===i?'selected':''}" data-card="${i}" aria-pressed="${state.card===i}"><div><b>${b.n}</b><small style="display:block;margin-top:5px">${b.s}</small></div><span class="card-last">•••• &nbsp; ${b.last}</span></button>`).join('')}</div><div class="section-title"><h2>Cartão selecionado</h2></div><div class="surface overview"><small>Consolidação</small><strong>${banks[state.card].n}</strong><div class="highlight">Os valores detalhados serão exibidos após a integração.</div></div></div>`}
function review(){const names=['Compra sem categoria','Pix aguardando identificação','Notificação duplicada'];return `<div class="screen-page">${heading('Sua atenção','Revisar','Só o que precisa de você, sem excesso de ruído.')}<div class="surface overview"><small>Eventos a revisar</small><strong>${3-state.reviewed.length}</strong><span class="highlight">Revisões neste protótipo não alteram dados reais</span></div><div class="section-title"><h2>Pendências</h2><button data-action="reviewInfo">Sobre a captura</button></div>${names.map((name,i)=>`<div class="surface review-item ${state.reviewed.includes(i)?'is-done':''}">${jelly(i===1?'lilac':i===2?'lime':'orange','')}<div class="review-copy"><b>${name}</b><p>${['Confira a categoria para manter as análises precisas.','Verifique o titular da transferência antes de confirmar.','Compare o evento com os registros anteriores.'][i]}</p><button data-review="${i}" ${state.reviewed.includes(i)?'disabled':''}>${state.reviewed.includes(i)?'Revisado ✓':'Marcar revisado'}</button></div></div>`).join('')}${state.reviewed.length===3?'<div class="surface empty-state">Tudo revisado. Seu painel está em dia.</div>':''}</div>`}
function render(){const tab=state.tab;$('#screen').innerHTML=({home,expenses,ads,cards,review})[tab]();$$('#dock button').forEach(b=>{const selected=b.dataset.tab===tab;b.classList.toggle('active',selected);b.setAttribute('aria-current',selected?'page':'false')});if(tab==='home'){const root=$('#homePage');root.classList.toggle('hero-expanded',state.expanded);if(state.expanded)requestAnimationFrame(updateCarousel)}$('#topbar').classList.toggle('is-scrolled',false)}
function $$(s,r=document){return [...r.querySelectorAll(s)]}
function updateCarousel(){const track=$('#carouselTrack'),vp=$('#carouselViewport');if(!track||!vp)return;const width=vp.clientWidth*.76,gap=12,offset=(vp.clientWidth-width)/2-state.slide*(width+gap);track.style.transform=`translate3d(${offset}px,0,0)`;$$('.carousel-slide',vp).forEach((el,i)=>{el.classList.toggle('current',i===state.slide);el.setAttribute('aria-hidden',i!==state.slide?'true':'false')});$$('.carousel-dots button').forEach((el,i)=>{el.classList.toggle('active',i===state.slide);el.setAttribute('aria-selected',i===state.slide?'true':'false')})}
function expand(play=true){if(state.tab!=='home')return;clearTimeout(autoClose);clearInterval(autoAdvance);state.expanded=true;$('#homePage')?.classList.add('hero-expanded');requestAnimationFrame(updateCarousel);if(play&&!matchMedia('(prefers-reduced-motion: reduce)').matches){autoAdvance=setInterval(()=>{state.slide=(state.slide+1)%3;updateCarousel()},2700);autoClose=setTimeout(()=>collapse(),8200)}}
function collapse(){clearTimeout(autoClose);clearInterval(autoAdvance);state.expanded=false;$('#homePage')?.classList.remove('hero-expanded')}
function go(tab){if(!['home','expenses','ads','cards','review'].includes(tab))return;clearTimeout(autoClose);clearInterval(autoAdvance);state.tab=tab;render();$('#scroller').scrollTop=0;if(tab==='home'&&state.expanded)requestAnimationFrame(updateCarousel)}
function notify(msg){clearTimeout(toastTimeout);const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');toastTimeout=setTimeout(()=>el.classList.add('hidden'),3100)}
function action(a){switch(a){case'prev':case'next':clearInterval(autoAdvance);clearTimeout(autoClose);state.slide=(state.slide+(a==='next'?1:2))%3;updateCarousel();break;case'slideAction':notify(`${stars[state.slide].title}: dados demonstrativos.`);break;case'wins':go('expenses');break;case'goal':go('expenses');break;case'refund':notify('Estornos de R$ 349,90 incluídos no panorama.');break;case'tip':notify('Antes de comprar, confira quanto falta para sua meta semanal.');break;case'category':notify('As categorias refletem a amostra de demonstração.');break;case'calendar':notify('Calendário de novembro de 2026.');break;case'adDemo':case'adInfo':notify('Conectores externos não estão ativos neste protótipo.');break;case'reviewInfo':notify('Os eventos exibidos são exemplos.');break;default:break}}
$('#dock').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
$('#screen').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){state.slide=0;expand(false);return}if(b.dataset.action){action(b.dataset.action);return}if(b.dataset.index!==undefined){clearInterval(autoAdvance);clearTimeout(autoClose);state.slide=+b.dataset.index;updateCarousel();return}if(b.dataset.day!==undefined){state.day=+b.dataset.day;$$('[data-day]').forEach(el=>{el.classList.toggle('selected',+el.dataset.day===state.day);el.setAttribute('aria-pressed',+el.dataset.day===state.day?'true':'false')});return}if(b.dataset.tabGo){go(b.dataset.tabGo);return}if(b.dataset.period){state.period=b.dataset.period;render();return}if(b.dataset.heat!==undefined){const n=+b.dataset.heat;if(n>0&&n<=30){state.heatDay=n;render()}return}if(b.dataset.card!==undefined){state.card=+b.dataset.card;render();return}if(b.dataset.review!==undefined){const i=+b.dataset.review;if(!state.reviewed.includes(i)){state.reviewed.push(i);render()}return}});
let dragX=null;$('#screen').addEventListener('pointerdown',e=>{if(!e.target.closest('#carouselViewport'))return;dragX=e.clientX});$('#screen').addEventListener('pointerup',e=>{if(dragX===null)return;const delta=e.clientX-dragX;dragX=null;if(Math.abs(delta)>35){clearInterval(autoAdvance);clearTimeout(autoClose);state.slide=Math.min(2,Math.max(0,state.slide+(delta<0?1:-1)));updateCarousel()}});$('#screen').addEventListener('pointercancel',()=>dragX=null);
$('#scroller').addEventListener('scroll',()=>{$('#topbar').classList.toggle('is-scrolled',$('#scroller').scrollTop>25)},{passive:true});$('#notifications').addEventListener('click',()=>notify('Não há novas notificações nesta demonstração.'));$('#avatar').addEventListener('click',()=>{if(state.tab==='home')state.expanded?collapse():expand(false);else notify('Perfil de demonstração NexaPag V2.')});window.addEventListener('resize',()=>{if(state.expanded)updateCarousel()});
render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){setTimeout(()=>{if(state.tab==='home'&&state.firstShow){state.firstShow=false;expand(true)}},1900)}
</script>
</body>
</html>
