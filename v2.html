// Each instance runs the user's original transparent liquid motion. All instances
// reuse one cached small asset; the observer pauses offscreen video decoders.
let motionObserver=null;
const orbReduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function prepareMotionOrbs(){
  if(motionObserver)motionObserver.disconnect();
  motionObserver=null;
  const videos=[...document.querySelectorAll('#screen .orb-cinema .orb-media')];
  if(orbReduceMotion.matches){videos.forEach(v=>{v.pause();v.removeAttribute('autoplay')});return;}
  if(!videos.length)return;
  motionObserver=new IntersectionObserver(entries=>{
    for(const entry of entries){
      const video=entry.target;
      if(entry.isIntersecting && document.visibilityState==='visible'){
        const promise=video.play();if(promise?.catch)promise.catch(()=>{video.parentElement?.classList.remove('motion-playing')});
      } else {video.pause();video.parentElement?.classList.remove('motion-playing');}
    }
  },{root:document.getElementById('scroller'),threshold:.05,rootMargin:'80px 0px 80px 0px'});
  videos.forEach((video,index)=>{
    video.addEventListener('playing',()=>video.parentElement?.classList.add('motion-playing'));
    video.addEventListener('error',()=>video.parentElement?.classList.remove('motion-playing'));
    video.addEventListener('loadedmetadata',()=>{
      if(Number.isFinite(video.duration)&&video.duration>1){try{video.currentTime=(index*.53)%video.duration;}catch{}}
    },{once:true});
    motionObserver.observe(video);
  });
}
document.addEventListener('visibilitychange',()=>{
  const videos=document.querySelectorAll('#screen .orb-media');
  if(document.hidden){videos.forEach(v=>v.pause());return;}
  if(!orbReduceMotion.matches)videos.forEach(v=>{
    if(v.getBoundingClientRect().bottom>0 && v.getBoundingClientRect().top<innerHeight){v.play().catch(()=>{});}
  });
});
orbReduceMotion.addEventListener?.('change',()=>prepareMotionOrbs());

function action(a){switch(a){case'prev':case'next':stopAutoplay();state.slide=(state.slide+(a==='next'?1:2))%3;updateCarousel();break;case'collapse':collapse();break;case'expenseReplay':animateExpense();break;case'graphReplay':animateChart();break;case'expenseDetails':$('#spendingChart')?.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'nearest'});break;case'expenseIncome':notify('Entradas demonstrativas: '+money(1950)+'.');break;case'slideAction':notify(`${stars[state.slide].title}: dados demonstrativos.`);break;case'wins':go('expenses');break;case'goal':go('expenses');break;case'refund':notify('Estornos de R$ 349,90 incluídos no panorama.');break;case'tip':notify('Antes de comprar, confira quanto falta para sua meta semanal.');break;case'category':notify('As categorias refletem a amostra de demonstração.');break;case'calendar':notify('Calendário de novembro de 2026.');break;case'adDemo':case'adInfo':notify('Conectores externos não estão ativos neste protótipo.');break;case'reviewInfo':notify('Os eventos exibidos são exemplos.');break;default:break}}
$('#dock').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
$('#screen').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){state.slide=0;expand(false);return}if(b.dataset.action){if(b.dataset.action==='slideAction'){const card=b.closest('.carousel-slide');if(card){state.slide=Number(card.dataset.slide);updateCarousel()}}action(b.dataset.action);return}if(b.dataset.index!==undefined){stopAutoplay();state.slide=+b.dataset.index;updateCarousel();return}if(b.dataset.day!==undefined){state.day=+b.dataset.day;$$('[data-day]').forEach(el=>{el.classList.toggle('selected',+el.dataset.day===state.day);el.setAttribute('aria-pressed',+el.dataset.day===state.day?'true':'false')});return}if(b.dataset.tabGo){go(b.dataset.tabGo);return}if(b.dataset.period){state.period=b.dataset.period;state.graphIndex=6;render();return}if(b.dataset.graph!==undefined){activateGraph(Number(b.dataset.graph));return}if(b.dataset.heat!==undefined){const n=+b.dataset.heat;if(n>0&&n<=30){state.heatDay=n;render()}return}if(b.dataset.card!==undefined){state.card=+b.dataset.card;render();return}if(b.dataset.review!==undefined){const i=+b.dataset.review;if(!state.reviewed.includes(i)){state.reviewed.push(i);render()}return}});
let carouselGesture=null, suppressCarouselClick=false;
const stopAutoplay=()=>{clearInterval(autoAdvance);clearTimeout(autoClose)};
const carouselViewport=()=>$('#carouselViewport');
$('#screen').addEventListener('pointerdown',e=>{
 const viewport=e.target.closest('#carouselViewport');
 if(!viewport||!state.expanded||e.target.closest('button'))return;
 stopAutoplay();
 carouselGesture={x:e.clientX,y:e.clientY,lastX:e.clientX,lastT:performance.now(),velocity:0,delta:0,horizontal:false,id:e.pointerId};
 viewport.classList.add('gesture-ready');
 viewport.setPointerCapture(e.pointerId);
});
$('#screen').addEventListener('pointermove',e=>{
 if(!carouselGesture||e.pointerId!==carouselGesture.id)return;
 const g=carouselGesture, dx=e.clientX-g.x,dy=e.clientY-g.y;
 if(!g.horizontal&&Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)*1.2)g.horizontal=true;
 if(!g.horizontal)return;
 const vp=carouselViewport(), track=$('#carouselTrack');if(!vp||!track)return;
 const now=performance.now(),dt=Math.max(1,now-g.lastT);
 g.velocity=.72*g.velocity+.28*((e.clientX-g.lastX)/dt);
 g.delta=dx;g.lastX=e.clientX;g.lastT=now;
 track.classList.add('is-dragging');
 const atEdge=(state.slide===0&&dx>0)||(state.slide===2&&dx<0);
 updateCarousel({dragOffset:atEdge?dx*.32:dx});
});
function endCarouselGesture(e,canceled=false){
 if(!carouselGesture||e.pointerId!==carouselGesture.id)return;
 const g=carouselGesture;carouselGesture=null;
 carouselViewport()?.classList.remove('gesture-ready');
 $('#carouselTrack')?.classList.remove('is-dragging');
 if(g.horizontal){
  const delta=g.delta;
  if(!canceled&&(Math.abs(delta)>49||Math.abs(g.velocity)>.44))state.slide=Math.max(0,Math.min(2,state.slide+(delta<0?-1:1)*-1));
  suppressCarouselClick=true;
  requestAnimationFrame(()=>{suppressCarouselClick=false});
 }
 updateCarousel();
}
$('#screen').addEventListener('pointerup',e=>endCarouselGesture(e));
$('#screen').addEventListener('pointercancel',e=>endCarouselGesture(e,true));
$('#screen').addEventListener('click',e=>{if(suppressCarouselClick&&e.target.closest('#carouselViewport')){e.stopImmediatePropagation();e.preventDefault()}},true);
$('#screen').addEventListener('keydown',e=>{const point=e.target.closest('[data-graph]');if(point&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const ix=(Number(point.dataset.graph)+(e.key==='ArrowRight'?1:6))%7;activateGraph(ix);$(`[data-graph="${ix}"]`)?.focus();}});
$('#screen').addEventListener('keydown',e=>{if(!e.target.closest('#carouselViewport'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stopAutoplay();state.slide=Math.max(0,Math.min(2,state.slide+(e.key==='ArrowRight'?1:-1)));updateCarousel()}if(e.key==='Escape')collapse()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(autoAdvance);clearTimeout(autoClose)}});
$('#scroller').addEventListener('scroll',()=>{$('#topbar').classList.toggle('is-scrolled',$('#scroller').scrollTop>25)},{passive:true});$('#notifications').addEventListener('click',()=>notify('Não há novas notificações nesta demonstração.'));$('#avatar').addEventListener('click',()=>{if(state.tab==='home')state.expanded?collapse():expand(false);else notify('Perfil de demonstração NexaPag V2.')});window.addEventListener('resize',()=>{if(state.expanded)updateCarousel()});
render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){setTimeout(()=>{if(state.tab==='home'&&state.firstShow){state.firstShow=false;expand(true)}},1900)}
</script>
</body>
