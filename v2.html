/* V2.3 | Motion original do usuário, VP9 alpha 60fps, otimizado a 224px.

.jelly.orb-cinema{isolation:isolate;overflow:hidden;contain:paint;transform:translateZ(0);border:1px solid rgba(255,255,255,.78);background:radial-gradient(circle at 29% 17%,rgba(255,255,255,.72),transparent 47%),radial-gradient(circle at 76% 82%,color-mix(in srgb,var(--orb) 28%,transparent),transparent 65%),color-mix(in srgb,var(--orb) 12%,rgba(255,255,255,.7));box-shadow:inset 0 1px 3px #fff,inset -2px -3px 9px color-mix(in srgb,var(--orb) 18%,transparent),0 5px 12px color-mix(in srgb,var(--orb) 17%,transparent);--orb-film-filter:hue-rotate(27deg) saturate(.91) contrast(1.03)}

.jelly.orb-cinema.red{--orb-film-filter:saturate(.85) contrast(1.04)}
.jelly.orb-cinema.orange{--orb-film-filter:hue-rotate(27deg) saturate(.87) contrast(1.02)}

.jelly.orb-cinema:before{z-index:2;opacity:.6;pointer-events:none}
.jelly.orb-cinema:after{z-index:2;pointer-events:none;opacity:.35}

/* V2.4 · orb fill is a generated nine-frame animated WebP, followed by the original 60fps liquid motion. */
.jelly.orb-cinema{overflow:visible;contain:none;isolation:isolate;transform:translateZ(0);box-shadow:inset 0 1px 2px #fff,inset -2px -2px 6px color-mix(in srgb,var(--orb) 16%,transparent),0 5px 13px color-mix(in srgb,var(--orb) 21%,transparent)}

/* Category glyph signatures: Grok-like expression -> morph -> only category icon */
.category{gap:12px;min-height:82px;overflow:visible;position:relative;}
.category-morph{--cat-top:#f8a886;--cat-deep:#cf526f;--cat-accent:#a54c53;position:relative;isolation:isolate;display:grid;place-items:center;flex:none;width:53px;height:53px;padding:0;border:0;background:transparent;border-radius:17px;color:var(--cat-accent);cursor:pointer;overflow:visible;touch-action:manipulation;transition:transform .22s cubic-bezier(.18,.8,.2,1)}
.category-morph:active{transform:scale(.94)}
.category-morph:focus-visible{outline:2px solid #8763bb;outline-offset:3px}
.category-morph--lilac{--cat-top:#d5adf7;--cat-deep:#8259b6;--cat-accent:#8058aa}
.category-morph--lime{--cat-top:#c9dcad;--cat-deep:#699f81;--cat-accent:#478968}
.category-morph--red{--cat-top:#f4a6b4;--cat-deep:#c45b6c;--cat-accent:#b25960}
.category-morph-orb{position:absolute;inset:2px;border-radius:50%;z-index:1;opacity:0;transform:scale(.68);background:radial-gradient(ellipse at 27% 10%,rgba(255,255,255,.87),transparent 31%),radial-gradient(circle at 93% 99%,#211a3d6b,transparent 40%),radial-gradient(ellipse at 71% 36%,var(--cat-top),transparent 55%),linear-gradient(138deg,var(--cat-deep),var(--cat-top) 60%,var(--cat-deep));box-shadow:inset 2px 2px 6px #ffffffb9,inset -3px -5px 9px #4b22537a,0 8px 17px color-mix(in srgb,var(--cat-deep) 30%,transparent),0 0 0 1px #ffffffbf;will-change:transform,opacity;pointer-events:none}
.category-morph-orb::before{content:'';position:absolute;inset:1px;border-radius:inherit;border:1px solid #ffffff8c;box-shadow:inset 1px 1px 3px #fff9;pointer-events:none}
.category-morph-orb::after{content:'';position:absolute;top:10%;left:27%;width:48%;height:19%;border-radius:50%;transform:rotate(-29deg);background:#ffffffa5;filter:blur(3px);pointer-events:none}
.category-morph-eyes{position:absolute;z-index:2;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding-bottom:10px;opacity:0;pointer-events:none;will-change:transform}
.category-morph-eyes i{display:block;width:5px;height:13px;background:#ffffff;border-radius:9px;box-shadow:0 0 3px #ffffffa4}
.category-morph-glyph{z-index:3;position:relative;display:grid;place-items:center;opacity:1;transform:none;color:var(--cat-accent)}
.category-morph-glyph svg{width:27px;height:27px;display:block;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 1px 0 #fff9)}
.category-morph.is-playing .category-morph-orb{animation:categoryOrbMorph 1.75s cubic-bezier(.2,.75,.22,1) both}

.category-morph.is-playing .category-morph-glyph{animation:categoryGlyphReveal 1.75s cubic-bezier(.17,.7,.22,1) both}
.category-morph.is-playing .category-morph-eyes i:first-child{animation:categoryBlinkLeft 1.75s ease-in-out both}
.category-morph.is-playing .category-morph-eyes i:last-child{animation:categoryBlinkRight 1.75s ease-in-out both}
.category-morph--lilac.is-playing{--groko-shift:-7deg}
.category-morph--lime.is-playing{--groko-shift:7deg}

.category-morph.is-playing .category-morph-glyph:after{animation:categoryRing 1.75s ease-out both}

function expenseCalendarGradient(items){
 const total=items.reduce((v,it)=>v+it.value,0);if(!total)return 'linear-gradient(95deg,#eed9c5,#f6e9d5)';
 const color=it=>{const cat=EXPENSE_CATEGORY_DETAIL.find(c=>c.n===it.category);const i=cat?.subs.findIndex(sub=>sub.n===it.subcategory)??-1;return i>=0?cat.colors[i]:WEEK_PALETTE[it.category]?.color||'#d9ac9c'};
 if(items.length===1)return `linear-gradient(95deg,${color(items[0])},${WEEK_PALETTE[items[0].category]?.light||color(items[0])})`;
 const stops=[`${color(items[0])} 0%`];let progress=0;
 items.forEach((it,i)=>{progress+=it.value/total*100;if(i<items.length-1){stops.push(`${color(it)} ${Math.max(0,progress-7).toFixed(1)}%`);stops.push(`${color(items[i+1])} ${Math.min(100,progress+7).toFixed(1)}%`)}});
 stops.push(`${color(items[items.length-1])} 100%`);
 return `linear-gradient(95deg,${stops.join(',')})`;
}

// One periodic canvas renderer for all finance orbs. No video loop edges, no hard-cut alpha resets.
const orbReduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const TWO_PI=Math.PI*2,LIQUID_CYCLE_MS=6400;
let liquidRaf=0,liquidCanvases=[],liquidVisible=true;
const MONO_TONES={orange:[{category:'Alimentação',value:1}],lilac:[{category:'Compras',value:1}],lime:[{category:'Transporte',value:1}],red:[{category:'Casa',value:1}]};
function hexRGB(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function rgba(hex,a){return `rgba(${hexRGB(hex).join(',')},${a})`}
function paintLiquid(canvas,items,phase){
 const ctx=canvas.getContext('2d',{alpha:true});if(!ctx)return;
 const s=canvas.width/80;ctx.setTransform(s,0,0,s,0,0);ctx.clearRect(0,0,80,80);
 const entries=items.filter(x=>x.value>0&&WEEK_PALETTE[x.category]);if(!entries.length)return;
 const total=entries.reduce((sum,it)=>sum+it.value,0);
 ctx.save();ctx.beginPath();ctx.arc(40,40,36.2,0,TWO_PI);ctx.clip();
 const topTone=WEEK_PALETTE[entries[entries.length-1].category];
 const base=ctx.createLinearGradient(5,5,75,77);base.addColorStop(0,topTone.light);base.addColorStop(.56,topTone.color);base.addColorStop(1,topTone.deep);ctx.fillStyle=base;ctx.fillRect(0,0,80,80);
 // Draw nested, gently undulating category layers. The boundaries are weighted by actual amounts.
 for(let j=entries.length-2;j>=0;j--){
   const share=entries.slice(0,j+1).reduce((v,r)=>v+r.value,0)/total;
   const y0=80*(1-share);const color=WEEK_PALETTE[entries[j].category];
   const shape=new Path2D();shape.moveTo(-5,85);
   shape.lineTo(-5,y0+2.3*Math.sin(phase+j));
   for(let x=0;x<=85;x+=2){
      const wave=3.3*Math.sin(x*.095+phase+j*.72)+1.6*Math.sin(x*.18-phase*2+j);
      shape.lineTo(x,y0+wave);
   }
   shape.lineTo(85,85);shape.closePath();
   const g=ctx.createLinearGradient(6,y0-17,76,y0+60);g.addColorStop(0,color.light);g.addColorStop(.49,color.color);g.addColorStop(1,color.deep);
   ctx.fillStyle=g;ctx.fill(shape);
   // A faint color diffusion across the fluid seam, without replacing the proportional split.
   const mist=ctx.createLinearGradient(0,y0-7,0,y0+9);mist.addColorStop(0,rgba(color.color,0));mist.addColorStop(.48,rgba(color.light,.29));mist.addColorStop(1,rgba(color.color,0));
   ctx.fillStyle=mist;ctx.fillRect(0,y0-9,80,20);
 }
 // Shared, circular and cyclical specular flow. All harmonics have integer periods.
 const cx=31+12*Math.cos(phase),cy=20+8*Math.sin(phase);
 let glow=ctx.createRadialGradient(cx,cy,1,cx,cy,34);glow.addColorStop(0,'rgba(255,255,255,.40)');glow.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,80,80);
 ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(28,17,19,7,-.42,0,TWO_PI);ctx.fill();
 let glass=ctx.createRadialGradient(25,15,4,42,44,41);glass.addColorStop(0,'rgba(255,255,255,.31)');glass.addColorStop(.62,'rgba(255,255,255,0)');glass.addColorStop(1,'rgba(27,24,42,.22)');ctx.fillStyle=glass;ctx.fillRect(0,0,80,80);
 ctx.restore();
 ctx.beginPath();ctx.arc(40,40,35.8,0,TWO_PI);ctx.strokeStyle='rgba(255,255,255,.77)';ctx.lineWidth=2;ctx.stroke();
 ctx.beginPath();ctx.arc(40,40,34,Math.PI*.19,Math.PI*.87);ctx.strokeStyle='rgba(80,65,90,.10)';ctx.lineWidth=1.8;ctx.stroke();
}
function stopLiquid(){cancelAnimationFrame(liquidRaf);liquidRaf=0;liquidCanvases=[]}
function frameLiquid(t){
 if(document.hidden||state.tab!=='home'||!liquidCanvases.length){liquidRaf=0;return}
 const phase=(t%LIQUID_CYCLE_MS)/LIQUID_CYCLE_MS*TWO_PI;
 liquidCanvases.forEach(({canvas,items,offset})=>{
    if(!canvas.isConnected)return;
    paintLiquid(canvas,items,phase+offset);
 });
 liquidRaf=requestAnimationFrame(frameLiquid);
}
function prepareMotionOrbs(){
 stopLiquid();
 const items=[...document.querySelectorAll('#screen .orb-cinema')];
 for(let i=0;i<items.length;i++){
   const orb=items[i];const tone=['orange','lilac','lime','red'].find(t=>orb.classList.contains(t))||'orange';
   const canvas=document.createElement('canvas');canvas.className='liquid-canvas';canvas.width=112;canvas.height=112;canvas.setAttribute('aria-hidden','true');orb.appendChild(canvas);
   liquidCanvases.push({canvas,items:MONO_TONES[tone],offset:i*.61});
   orb.querySelector('video')?.pause();
 }
 document.querySelectorAll('#screen [data-week-orb]').forEach(canvas=>{
   liquidCanvases.push({canvas,items:WEEK_LEDGER[+canvas.dataset.weekOrb].items,offset:+canvas.dataset.weekOrb*.77});
 });
 liquidCanvases.forEach(({canvas,items,offset})=>paintLiquid(canvas,items,offset+.72));
 if(!orbReduceMotion.matches&&state.tab==='home'&&!document.hidden)liquidRaf=requestAnimationFrame(frameLiquid);
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)cancelAnimationFrame(liquidRaf);

 const layer=document.createElement('div');layer.className='insight-layer';layer.id='moneyInsightLayer';layer.innerHTML=`<button class="insight-scrim" data-insight-close="1" aria-label="Fechar detalhes"></button><section class="insight-sheet" role="dialog" aria-modal="true" aria-labelledby="insightTitle"><button class="insight-close" type="button" data-insight-close="1" aria-label="Fechar">${icon('close')}</button><span class="eyebrow">NEXAPAG · ${budget?'PLANEJAMENTO':'CONCILIAÇÃO'}</span><h2 id="insightTitle">${title}</h2>${content}<p class="week-source">Valores ilustrativos, não conectados a movimentações bancárias reais.</p></section>`;
 document.querySelector('.phone').appendChild(layer);requestAnimationFrame(()=>layer.classList.add('is-visible'));layer.querySelector('.insight-close')?.focus({preventScroll:true});

let categoryMotionObserver;
function playCategoryMotion(button){
  if(window.NexaPagMicrobots)return window.NexaPagMicrobots.play(button);
  if(!button||!button.isConnected)return;
  button.classList.remove('is-playing');
  if(reducedMotion())return;
  const glyph=button.querySelector('.category-morph-glyph');
  if(!glyph)return;
  void button.offsetWidth;
  button.classList.add('is-playing');
}
function setupCategoryMotions(){
  categoryMotionObserver?.disconnect();
  const buttons=$$('.category-morph');
  if(!buttons.length||reducedMotion())return;
  if(!('IntersectionObserver' in window)){buttons.forEach(playCategoryMotion);return}
  categoryMotionObserver=new IntersectionObserver(entries=>{
    entries.filter(e=>e.isIntersecting).forEach(({target},i)=>{
      categoryMotionObserver.unobserve(target);
      setTimeout(()=>{if(target.isConnected&&state.tab==='expenses')playCategoryMotion(target)},i*110);
    });
  },{root:$('#scroller'),threshold:.55});
  buttons.forEach(el=>categoryMotionObserver.observe(el));
}
document.addEventListener('animationend',e=>{
  if(e.animationName==='categoryGlyphReveal')e.target.closest('.category-morph')?.classList.remove('is-playing');
});


// V2.8 · Keep reference video materials running only while the expanded carousel is visible.
function syncSlideBackdropMedia(){
  const active=state.tab==='home'&&Boolean(state.expanded)&&!document.hidden&&!reducedMotion();
  const videos=document.querySelectorAll('#carouselViewport .slide-motion-video');
  for(const video of videos){
    if(active){if(video.paused){const p=video.play();if(p&&typeof p.catch==='function')p.catch(()=>{});}}
    else if(!video.paused)video.pause();
  }
}
document.addEventListener('visibilitychange',syncSlideBackdropMedia);
window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change',syncSlideBackdropMedia);

function render(){stopLiquid();hideMoneyInsight(false);categoryMotionObserver?.disconnect();const walletOverlay=document.getElementById('walletLayer');if(walletOverlay)walletOverlay.remove();walletClosing=false;const tab=state.tab;const phone=document.querySelector('.phone');if(phone){phone.dataset.pageTheme=tab;phone.classList.remove('expenses-theme');phone.classList.toggle('scrolled-deep',$('#scroller').scrollTop>112)}cancelAnimationFrame(expenseMotionFrame);cancelAnimationFrame(graphMotionFrame);$('#screen').innerHTML=({home,expenses,ads,cards,review})[tab]();$('#dock').style.setProperty('--active-tab',String(['home','expenses','ads','cards','review'].indexOf(tab)));$$('#dock button').forEach(b=>{const selected=b.dataset.tab===tab;b.classList.toggle('active',selected);b.setAttribute('aria-current',selected?'page':'false')});if(tab==='home'){const root=$('#homePage');root.classList.toggle('hero-expanded',state.expanded);if(state.expanded)requestAnimationFrame(updateCarousel)}if(tab==='expenses'){requestAnimationFrame(()=>{animateExpense();animateChart();})}prepareMotionOrbs();syncSlideBackdropMedia();if(tab==='expenses')requestAnimationFrame(setupCategoryMotions);$('#topbar').classList.toggle('is-scrolled',false)}
function $$(s,r=document){return [...r.querySelectorAll(s)]}
function updateCarousel(options={}){const track=$('#carouselTrack'),vp=$('#carouselViewport');if(!track||!vp)return;const first=track.querySelector('.carousel-slide');if(!first)return;const width=first.offsetWidth,gap=parseFloat(getComputedStyle(track).columnGap)||12,offset=(vp.clientWidth-width)/2-state.slide*(width+gap)+(options.dragOffset||0);track.style.transform=`translate3d(${offset}px,0,0)`;$$('.carousel-slide',vp).forEach((el,i)=>{el.classList.toggle('current',i===state.slide);el.setAttribute('aria-hidden',i!==state.slide?'true':'false');el.querySelectorAll('button').forEach(b=>b.tabIndex=i===state.slide?0:-1);el.classList.toggle('side-prev',i<state.slide);el.classList.toggle('side-next',i>state.slide)});$$('.carousel-dots button').forEach((el,i)=>{el.classList.toggle('active',i===state.slide);el.setAttribute('aria-pressed',i===state.slide?'true':'false')})}
function expand(play=true){if(state.tab!=='home')return;clearTimeout(autoClose);clearInterval(autoAdvance);state.expanded=true;$('#homePage')?.classList.add('hero-expanded');syncSlideBackdropMedia();requestAnimationFrame(()=>requestAnimationFrame(updateCarousel));if(play&&!matchMedia('(prefers-reduced-motion: reduce)').matches){autoAdvance=setInterval(()=>{state.slide=(state.slide+1)%3;updateCarousel()},2700);autoClose=setTimeout(()=>collapse(),8200)}}
function collapse(){clearTimeout(autoClose);clearInterval(autoAdvance);state.expanded=false;$('#homePage')?.classList.remove('hero-expanded');syncSlideBackdropMedia();$('#scroller')?.classList.remove('carousel-interacting')}
function go(tab){if(!['home','expenses','ads','cards','review'].includes(tab))return;clearTimeout(autoClose);clearInterval(autoAdvance);state.tab=tab;render();$('#scroller').scrollTop=0;document.querySelector('.phone')?.classList.remove('scrolled-deep');if(tab==='home'&&state.expanded)requestAnimationFrame(updateCarousel)}
function notify(msg){clearTimeout(toastTimeout);const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');toastTimeout=setTimeout(()=>el.classList.add('hidden'),3100)}
function action(a){switch(a){case'prev':case'next':stopAutoplay();state.slide=(state.slide+(a==='next'?1:2))%3;updateCarousel();break;case'collapse':collapse();break;case'expenseReplay':animateExpense();break;case'graphReplay':animateChart();break;case'expenseDetails':$('#spendingChart')?.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'nearest'});break;case'expenseIncome':notify('Entradas demonstrativas: '+money(1950)+'.');break;case'slideAction':notify(`${stars[state.slide].title}: dados demonstrativos.`);break;case'wins':case'goal':showMoneyInsight('budget',document.activeElement);break;case'refund':showMoneyInsight('refund',document.activeElement);break;case'tip':notify('Antes de comprar, confira quanto falta para sua meta semanal.');break;case'category':toggleExpenseCategory('Alimentação',true);break;case'calendar':document.getElementById('calendarSection')?.scrollIntoView({behavior:reducedMotion()?'instant':'smooth',block:'start'});break;case'adDemo':case'adInfo':notify('Conectores externos não estão ativos neste protótipo.');break;case'reviewInfo':notify('Os eventos exibidos são exemplos.');break;default:break}}
$('#dock').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
$('#screen').addEventListener('click',e=>{const folder=e.target.closest('[data-wallet-folder]');if(folder){openWallet(Number(folder.dataset.walletFolder),folder);return}const b=e.target.closest('button');if(!b)return;if(b.dataset.categoryMotion){playCategoryMotion(b);return}if(b.dataset.categoryToggle){toggleExpenseCategory(b.dataset.categoryToggle);return}if(b.dataset.open){state.slide=0;expand(false);return}if(b.dataset.action){if(b.dataset.action==='slideAction'){const card=b.closest('.carousel-slide');if(card){state.slide=Number(card.dataset.slide);updateCarousel()}}action(b.dataset.action);return}if(b.dataset.index!==undefined){stopAutoplay();state.slide=+b.dataset.index;updateCarousel();return}if(b.dataset.day!==undefined){state.day=+b.dataset.day;$$('[data-day]').forEach(el=>{el.classList.toggle('selected',+el.dataset.day===state.day);el.setAttribute('aria-pressed',+el.dataset.day===state.day?'true':'false')});const details=$('#weekDayDetail');if(details)details.innerHTML=weekDetailMarkup(state.day);return}if(b.dataset.tabGo){go(b.dataset.tabGo);return}if(b.dataset.period){state.period=b.dataset.period;state.graphIndex=state.period==='Semana'?3:6;render();return}if(b.dataset.graph!==undefined){activateGraph(Number(b.dataset.graph));return}if(b.dataset.heat!==undefined){const n=+b.dataset.heat;if(n>0&&n<=30){state.heatDay=n;document.querySelectorAll('.heat-day').forEach(x=>{const yes=+x.dataset.heat===n;x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',String(yes))});const detail=document.getElementById('calendarDetail');if(detail)detail.innerHTML=calendarDetailMarkup(n)}return}if(b.dataset.card!==undefined){state.card=+b.dataset.card;render();return}if(b.dataset.review!==undefined){const i=+b.dataset.review;if(!state.reviewed.includes(i)){state.reviewed.push(i);render()}return}});
document.querySelector('.phone').addEventListener('click',e=>{const p=e.target.closest('[data-wallet-pick]');if(p){selectWalletCard(Number(p.dataset.walletPick));return}if(e.target.closest('[data-wallet-close]')){closeWallet();return}});
document.addEventListener('keydown',e=>{const layer=document.getElementById('walletLayer');if(!layer)return;if(e.key==='Escape'){e.preventDefault();closeWallet();return}if(e.key==='Tab'){const f=[...layer.querySelectorAll('button')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let carouselGesture=null, suppressCarouselClick=false;
const stopAutoplay=()=>{clearInterval(autoAdvance);clearTimeout(autoClose)};
const carouselViewport=()=>$('#carouselViewport');
$('#screen').addEventListener('pointerdown',e=>{
 const viewport=e.target.closest('#carouselViewport');
 if(!viewport||!state.expanded||e.target.closest('button'))return;
 stopAutoplay();
 carouselGesture={x:e.clientX,y:e.clientY,lastX:e.clientX,lastT:performance.now(),velocity:0,delta:0,horizontal:false,id:e.pointerId};
 viewport.classList.add('gesture-ready');
 viewport.setPointerCapture(e.pointerId);
});
$('#screen').addEventListener('pointermove',e=>{
 if(!carouselGesture||e.pointerId!==carouselGesture.id)return;
 const g=carouselGesture, dx=e.clientX-g.x,dy=e.clientY-g.y;
 if(!g.horizontal&&Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)*1.2)g.horizontal=true;
 if(!g.horizontal)return;
 const vp=carouselViewport(), track=$('#carouselTrack');if(!vp||!track)return;
 const now=performance.now(),dt=Math.max(1,now-g.lastT);
 g.velocity=.72*g.velocity+.28*((e.clientX-g.lastX)/dt);
 g.delta=dx;g.lastX=e.clientX;g.lastT=now;
 track.classList.add('is-dragging');
 const atEdge=(state.slide===0&&dx>0)||(state.slide===2&&dx<0);
 updateCarousel({dragOffset:atEdge?dx*.32:dx});
});
function endCarouselGesture(e,canceled=false){
 if(!carouselGesture||e.pointerId!==carouselGesture.id)return;
 const g=carouselGesture;carouselGesture=null;
 carouselViewport()?.classList.remove('gesture-ready');
 $('#carouselTrack')?.classList.remove('is-dragging');
 if(g.horizontal){
  const delta=g.delta;
  if(!canceled&&(Math.abs(delta)>49||Math.abs(g.velocity)>.44))state.slide=Math.max(0,Math.min(2,state.slide+(delta<0?-1:1)*-1));
  suppressCarouselClick=true;
  requestAnimationFrame(()=>{suppressCarouselClick=false});
 }
 updateCarousel();
}
$('#screen').addEventListener('pointerup',e=>endCarouselGesture(e));
$('#screen').addEventListener('pointercancel',e=>endCarouselGesture(e,true));
$('#screen').addEventListener('click',e=>{if(suppressCarouselClick&&e.target.closest('#carouselViewport')){e.stopImmediatePropagation();e.preventDefault()}},true);

$('#screen').addEventListener('keydown',e=>{if(!e.target.closest('#carouselViewport'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stopAutoplay();state.slide=Math.max(0,Math.min(2,state.slide+(e.key==='ArrowRight'?1:-1)));updateCarousel()}if(e.key==='Escape')collapse()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(autoAdvance);clearTimeout(autoClose)}});
$('#scroller').addEventListener('scroll',()=>{$('#topbar').classList.toggle('is-scrolled',$('#scroller').scrollTop>25);document.querySelector('.phone')?.classList.toggle('scrolled-deep',$('#scroller').scrollTop>112)},{passive:true});const THEME_KEY='nexapag-ui-theme';

try{if(localStorage.getItem(THEME_KEY)==='dark')nexaTheme='dark'}catch(_e){}

 const btn=document.getElementById('themeToggle');

 const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',nexaTheme==='dark'?'#111c17':'#e6f1de');
 try{localStorage.setItem(THEME_KEY,nexaTheme)}catch(_e){}
}
applyNexaTheme(nexaTheme);
document.getElementById('themeToggle')?.addEventListener('click',()=>applyNexaTheme(nexaTheme==='dark'?'light':'dark'));

render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){setTimeout(()=>{if(state.tab==='home'&&state.firstShow){state.firstShow=false;expand(true)}},1900)}
